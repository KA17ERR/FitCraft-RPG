[build]
  base = "."
  # Install deps for every workspace (root, backend, frontend) then build
  # the frontend. Backend deps must be installed at build time so the
  # function bundler can resolve backend/src/app.js's imports.
  command = "npm install && npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # bcrypt ships a compiled native (.node) binary loaded via dynamic
  # require paths that esbuild cannot statically bundle. Marking it
  # external tells esbuild to leave `require("bcrypt")` alone; Netlify's
  # function packer then copies the real bcrypt package (binary included)
  # into the deployed bundle instead of trying to inline its source.
  external_node_modules = ["bcrypt"]

# API requests keep their original path (e.g. /api/auth/login) when
# forwarded to the function, which is exactly what backend/src/app.js's
# routes already expect.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router SPA fallback — must come after the /api/* redirect above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
